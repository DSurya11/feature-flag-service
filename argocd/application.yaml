apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: feature-flag-service
  namespace: argocd
spec:
  project: default
  source:
    # the env-config repo, not the app repo
    repoURL: https://github.com/DSurya11/idp-gitops.git
    targetRevision: main
    # the manifests are at the repo root, not in a subfolder
    path: .
  destination:
    server: https://kubernetes.default.svc
    # matches the namespace already created in Step 10
    namespace: feature-flag
  syncPolicy:
    automated:
      # if a manifest file is ever deleted from the env-config repo, Argo CD deletes the corresponding resource from the cluster too
      prune: true
      # self-healing behavior: reverts manual drift in the cluster back to match Git
      selfHeal: true
    syncOptions:
      # the feature-flag namespace already exists; Argo CD does not need to create it
      - CreateNamespace=false
