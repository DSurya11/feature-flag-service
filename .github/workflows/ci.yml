# =============================================================================
# .github/workflows/ci.yml — Feature Flag Service CI
#
# Three jobs:
#   1. test           — runs on every push and every PR (all branches)
#   2. build-and-push — runs only on push to main, only after test passes
#                       pushes to ECR (not GHCR), SHA tag only (no :latest)
#                       runs Trivy vulnerability scan (fails on HIGH/CRITICAL)
#   3. update-env-config — updates overlays/dev/kustomization.yaml in env-config
#                           repo with the new image SHA, using a short-lived
#                           GitHub App installation token (no long-lived PAT)
#
# Auth strategy (zero static credentials):
#   AWS access:    OIDC → IAM role idp-github-ci (no AWS_ACCESS_KEY_ID anywhere)
#   env-config writes: GitHub App installation token generated per-run
#                      via actions/create-github-app-token@v1
#                      (App: ff-idp-ci-bot, registered under DSurya11)
#
# Image tagging strategy:
#   ECR registry:  693906847772.dkr.ecr.ap-south-1.amazonaws.com/feature-flag-service
#   Tag:           git commit SHA only — no :latest tag ever
#   Immutability:  enforced at ECR registry level (tag cannot be overwritten)
#   Reason:        :latest is a mutable pointer that silently shifts after every
#                  push. In a GitOps deployment manifest, :latest defeats the
#                  entire point of having an immutable reference.
# =============================================================================

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# GitHub occasionally starts two runs for one push; the second would fail pushing the same
# immutable ECR tag. One run per event+commit; the event is part of the key so a PR run
# never cancels the main-branch run for the same SHA.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.sha }}
  cancel-in-progress: true

# ---------------------------------------------------------------------------
# Job 1 — test
# Runs on every push and every pull_request. Unchanged from Steps 1-16.
# ---------------------------------------------------------------------------
jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: feature_flags_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime dependencies
        run: pip install --no-cache-dir -r requirements.txt

      - name: Install dev/test dependencies
        run: pip install --no-cache-dir -r requirements-dev.txt

      - name: Set environment variables
        run: |
          echo "DATABASE_URL=postgresql+psycopg2://ci:ci@localhost:5432/feature_flags_ci" >> $GITHUB_ENV
          echo "REDIS_URL=redis://localhost:6379" >> $GITHUB_ENV
          echo "JWT_SECRET_KEY=ci-throwaway-key-not-used-in-production" >> $GITHUB_ENV
          echo "ACCESS_TOKEN_EXPIRE_MINUTES=30" >> $GITHUB_ENV
          echo "PYTHONPATH=$GITHUB_WORKSPACE" >> $GITHUB_ENV

      - name: Run Alembic migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest tests/ -v --tb=short

  # ---------------------------------------------------------------------------
  # Job 2 — build-and-push
  # Runs ONLY on push to main, only after test passes.
  # Pushes to ECR using OIDC (no static AWS credentials).
  # ---------------------------------------------------------------------------
  build-and-push:
    name: Build and Push to ECR
    # Native arm64 runner (free for public repos): builds the arm64 image without QEMU.
    runs-on: ubuntu-24.04-arm
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      id-token: write  # REQUIRED for OIDC token request
      contents: read

    outputs:
      # Pass the SHA to the update-env-config job so it can update the manifest
      image_tag: ${{ steps.meta.outputs.image_tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Authenticate to AWS via OIDC — no static credentials.
      # The IAM role trust policy is scoped to exactly:
      #   repo:DSurya11@162597218/feature-flag-service@1368152185:ref:refs/heads/main
      # Any other repo or branch cannot assume this role.
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::693906847772:role/idp-github-ci
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Derive image metadata
        id: meta
        env:
          ECR_REGISTRY: 693906847772.dkr.ecr.ap-south-1.amazonaws.com
          ECR_REPOSITORY: feature-flag-service
        run: |
          IMAGE_TAG="${{ github.sha }}"
          FULL_IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "full_image=${FULL_IMAGE}" >> $GITHUB_OUTPUT
          echo "ecr_registry=${ECR_REGISTRY}" >> $GITHUB_OUTPUT
          echo "ecr_repository=${ECR_REPOSITORY}" >> $GITHUB_OUTPUT

      # "Re-run" of a green build: the SHA tag is immutable and already in ECR, so skip the
      # build instead of failing on the push. Trivy below still gates the existing image.
      - name: Check if image already exists
        id: exists
        run: |
          if aws ecr describe-images --region ap-south-1 \
               --repository-name "${{ steps.meta.outputs.ecr_repository }}" \
               --image-ids imageTag="${{ steps.meta.outputs.image_tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Image ${{ steps.meta.outputs.image_tag }} already in ECR - skipping build"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.exists.outputs.exists != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        if: steps.exists.outputs.exists != 'true'
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --provenance=false \
            --push \
            --tag "${{ steps.meta.outputs.full_image }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            .

      # Push BEFORE Trivy scan: ECR scan-on-push fires asynchronously.
      # We push first, then run Trivy as an explicit gate with exit-code: '1'.
      # If Trivy finds HIGH/CRITICAL, the workflow fails — the image is in ECR
      # but update-env-config (next job) depends on this job succeeding, so
      # a vulnerable image never propagates to the deployment manifest.


      # Trivy scans the just-pushed image. Fails the job on HIGH or CRITICAL findings.
      # This means a vulnerable image is in ECR but NEVER gets deployed (next job
      # depends on this one). The image can be manually deleted from ECR.
      # The image was pushed by buildx and is not in the runner's local docker daemon,
      # so Trivy pulls it from ECR. That needs registry credentials, and the image is
      # arm64 while the runner is amd64, so the platform must be set explicitly.
      - name: Authenticate Trivy to ECR
        run: |
          echo "TRIVY_USERNAME=AWS" >> "$GITHUB_ENV"
          echo "TRIVY_PASSWORD=$(aws ecr get-login-password --region ap-south-1)" >> "$GITHUB_ENV"
          echo "TRIVY_PLATFORM=linux/arm64" >> "$GITHUB_ENV"

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.full_image }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Print image reference
        run: |
          echo "===== Image pushed to ECR ====="
          echo "SHA tag (use for deployment): ${{ steps.meta.outputs.full_image }}"
          echo ""
          echo "ECR immutability is ENFORCED — this SHA tag cannot be overwritten."
          echo "To use: reference this exact tag in the deployment manifest."

  # ---------------------------------------------------------------------------
  # Job 3 — update-env-config
  # Runs after build-and-push succeeds.
  # Updates overlays/dev/kustomization.yaml with the new image SHA.
  # Uses a short-lived GitHub App installation token — no long-lived PAT.
  # ---------------------------------------------------------------------------
  update-env-config:
    name: Update env-config (dev overlay)
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read

    steps:
      - name: Generate GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          # GitHub App registered under DSurya11 with contents:write on
          # idp-gitops repo only.
          # App ID and private key are GitHub Actions secrets (not AWS secrets).
          app-id: ${{ secrets.FF_IDP_CI_BOT_APP_ID }}
          private-key: ${{ secrets.FF_IDP_CI_BOT_PRIVATE_KEY }}
          # Scope token to only the env-config repo
          repositories: idp-gitops

      - name: Clone env-config repo
        run: |
          git clone https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/DSurya11/idp-gitops.git env-config

      # Update newTag in the dev overlay; the Deployment and the migration Job both take
      # their image from this one Kustomize images stanza.
      - name: Update image SHA in env-config
        env:
          NEW_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          CHANGED_FILE: apps/feature-flag-service/overlays/dev/kustomization.yaml
        run: |
          cd env-config
          sed -i "s|newTag:.*|newTag: ${NEW_TAG}|g" "${CHANGED_FILE}"

          git config user.name "ff-idp-ci-bot[bot]"
          git config user.email "ff-idp-ci-bot[bot]@users.noreply.github.com"
          git add "${CHANGED_FILE}"
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore(deploy): update feature-flag-service image to ${NEW_TAG}"
          # Other CI bots (idp-portal, template services) push to the same repo; if one
          # lands first, rebase onto it (different files, no conflicts) and retry.
          for i in 1 2 3; do
            git push origin main && break
            [ "$i" = 3 ] && exit 1
            sleep $((i * 5)); git pull --rebase origin main
          done
          echo "==> env-config updated: ${CHANGED_FILE} -> ${NEW_TAG}"
